approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "equipo"

[permissions.equipo]
extends = ":workspace"

[permissions.equipo.filesystem]
"~/.ssh" = "deny"

[permissions.equipo.filesystem.":workspace_roots"]
"**/.env*" = "deny"
"data/**" = "read"

[permissions.equipo.network]
enabled = false

[[hooks.PreToolUse]]
matcher = "*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 ~/.codex/hook-seguridad.py"
